name: demo
on:
  push:
    branches: [main, feature/first-playable, feature/reference-pipeline-docker, feature/ww2-aircraft-blender, feature/ign-address-flight, feature/integration-ign-ww2]
  workflow_dispatch:
jobs:
  jumphp:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate Blender atlas and source data
        run: |
          python3 tools/blender/validate_assets.py
          python3 tools/blender/validate_ww2.py
      - name: Install
        run: bin/jumphp install combat-sprite-simulator
      - name: Test
        run: bin/jumphp test combat-sprite-simulator
      - name: Repository lint
        run: bin/jumphp lint
      - name: Headless screenshot
        run: bin/jumphp shot combat-sprite-simulator 120
      - name: Play screenshot
        env:
          JUMPHP_INPUT: '[[5,"confirm"]]'
        run: bin/jumphp shot combat-sprite-simulator 240 var/screenshots/play.png
      - name: Boss screenshot
        env:
          JUMPHP_SCENE: 'App\Scene\PlayScene'
          JUMPHP_SCENE_PARAMS: '{"boss":true}'
        run: bin/jumphp shot combat-sprite-simulator 120 var/screenshots/boss.png
      - name: WWII gameplay screenshot
        env:
          JUMPHP_SCENE: 'App\Scene\PlayScene'
        run: bin/jumphp shot combat-sprite-simulator 155 var/screenshots/ww2-wave.png
      - name: Free flight screenshot
        env:
          JUMPHP_SCENE: 'App\Scene\GeoFlightScene'
        run: bin/jumphp shot combat-sprite-simulator 120 var/screenshots/survol.png
      - name: Native in-game address screenshot
        env:
          JUMPHP_SCENE: 'App\Scene\AddressEntryScene'
        run: bin/jumphp shot combat-sprite-simulator 120 var/screenshots/address-entry.png
      - name: Browser engine
        run: bin/jumphp engine:download
      - name: Browser build
        run: bin/jumphp build combat-sprite-simulator
      - name: Build address-search site
        run: bin/jumphp build:site combat-sprite-simulator
      - name: Browser screenshot
        run: bin/jumphp webshot combat-sprite-simulator 4 '[[1,"Enter"],[2,"ArrowLeft"],[2.4," "]]'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-captures
          path: |
            games/combat-sprite-simulator/var/screenshots/
            games/combat-sprite-simulator/dist/webshot.png
            games/combat-sprite-simulator/dist/web/
