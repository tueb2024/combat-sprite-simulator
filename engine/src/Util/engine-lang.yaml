  "macOS: coming soon": "macOS：近日対応"
  "Other systems": "その他のシステム"
  "Linux (installer)": "Linux（インストーラー）"
  "Windows (installer)": "Windows（インストーラー）"
  "Android (.apk)": "Android（.apk）"
  "2. Install it": "2. インストール"
  "Linux: make it executable and run it (chmod +x runtime-setup-linux-x86_64 && ./runtime-setup-linux-x86_64).": "Linux：実行可能にして起動します（chmod +x runtime-setup-linux-x86_64 && ./runtime-setup-linux-x86_64）。"
  "Windows: double-click runtime-setup.exe.": "Windows：runtime-setup.exe をダブルクリックします。"
  "Android: open the downloaded file jumphp-runtime-android.apk and allow installing from this browser when your phone asks (it is not on Google Play).": "Android：ダウンロードした jumphp-runtime-android.apk を開き、端末に聞かれたらこのブラウザからのインストールを許可してください（Google Play にはありません）。"
  "3. Start it": "3. 起動"
  "Open \"JumPHP runtime\" once and allow its notifications: it keeps running in the background (a notification shows it) and starts with your phone afterwards. On some phones (Xiaomi...) also allow \"autostart\" and \"no battery restriction\" with its buttons.": "「JumPHP runtime」を一度開き、通知を許可してください：バックグラウンドで動作し（通知で分かります）、その後は端末と一緒に起動します。一部の端末（Xiaomi など）では、ボタンから「自動起動」と「バッテリー制限なし」も許可してください。"
  "Open \"JumPHP runtime\" from your applications. An icon appears in the notification area; it starts with your session afterwards.": "アプリ一覧から「JumPHP runtime」を開きます。通知領域にアイコンが表示され、その後はセッションと一緒に起動します。"
  "4. Allow this application": "4. このアプリケーションを許可"
  "A notification asks whether {title} may use your phone's network: tap Always (or This time). Your browser may also ask to reach devices on your local network: accept.": "通知で {title} がスマートフォンのネットワークを使ってよいか尋ねられます：「常に許可」（または「今回のみ」）をタップしてください。ブラウザがローカルネットワーク上のデバイスへのアクセスを求めることもあります：許可してください。"
  "The runtime asks once whether {title} may use your network. Answer Allow. Your browser may also ask to reach devices on your local network: accept.": "ランタイムは一度だけ、{title} があなたのネットワークを使ってよいか尋ねます。「許可」と答えてください。ブラウザがローカルネットワーク上のデバイスへのアクセスを求めることもあります：許可してください。"
  "Start the runtime app": "ランタイムアプリを起動"
  "Ask for the authorisation now": "今すぐ許可を求める"
  "Android help": "Android のヘルプ"
  "All releases": "すべてのバージョン"
  "Close": "閉じる"
  "Done": "完了"
  "Local network active. You can close this window.": "ローカルネットワーク有効。このウィンドウを閉じて構いません。"
  "You refused. Click \"Ask\" to be asked again.": "拒否しました。再度確認するには「確認」をクリックしてください。"
  "The runtime is running. Allow this application in its window.": "ランタイムは動作中です。そのウィンドウでこのアプリケーションを許可してください。"
  "Waiting for the runtime... (looking again every 2 seconds)": "ランタイムを待っています...（2 秒ごとに再検索）"
zh:
  "INSTALL": "安装"
  "DOWNLOAD {platform}": "下载 {platform}"
  "Server network": "服务器网络"
  "Local network active": "本地网络已启用"
  "Allow this app on your network": "在您的网络上允许此应用"
  "Refused - click to ask again": "已拒绝 - 点击重新询问"
  "Local network off - install the runtime": "本地网络未启用 - 请安装 runtime"
  "Looking for the runtime...": "正在查找 runtime..."
  "Server proxy (your choice)": "服务器代理（您的选择）"
  "Local": "本地"
  "Server": "服务器"
  "Start / install the app": "启动 / 安装应用"
  "How to install": "如何安装"
  "Allow this app": "允许此应用"
  "Not now": "暂不"
  "Connections go through the jumphp.net server (the JumPHP runtime does not exist on iPhone).": "连接将通过 jumphp.net 服务器（iPhone 上没有 JumPHP runtime）。"
  "Android: to connect from your phone's own network (Wi-Fi at home, VPN, a server that only accepts your address), install the free \"JumPHP runtime\" app, open it once, then come back here. Optional: without it {title} connects through the jumphp.net server.": "Android：要从手机自己的网络（家里的 Wi-Fi、VPN、只接受您地址的服务器）连接，请安装免费应用“JumPHP runtime”，打开一次后回到这里。可选：没有它时，{title} 通过 jumphp.net 服务器连接。"
  "Recommended: install the free JumPHP runtime so that {title} connects from your own computer (local network, VPN, servers that only accept your address). Optional: without it, the jumphp.net server connects for you.": "推荐：安装免费的 JumPHP runtime，使 {title} 从您自己的电脑（本地网络、VPN、只接受您地址的服务器）连接。可选：没有它时，由 jumphp.net 服务器代您连接。"
  "You refused {title} on this network. Tap \"Allow this app\" to be asked again.": "您在此网络上拒绝了 {title}。点按“允许此应用”可重新被询问。"
  "The JumPHP runtime is running: allow {title} to use your network (a question appears: choose Always).": "JumPHP runtime 正在运行：请允许 {title} 使用您的网络（会出现一个提问：请选择“始终”）。"
  "Use your own network": "使用您自己的网络"
  "{title} can connect from your own phone and network (your IP, your VPN, a server that only opens to you) through the JumPHP runtime, a small app of your phone. It only connects where you allow, never reads your files, and you can revoke it any time.": "{title} 可通过 JumPHP runtime（手机上的一个小应用）从您自己的手机和网络（您的 IP、VPN、只对您开放的服务器）连接。它只连接您允许的地方，从不读取您的文件，您可随时撤销。"
  "{title} can connect from your own computer and network (your IP, your VPN, a server that only opens to you) through the JumPHP runtime, a small program that stays in your tray. It only connects where you allow, never reads your files, and you can revoke it any time.": "{title} 可通过 JumPHP runtime（驻留在通知区域的小程序）从您自己的电脑和网络（您的 IP、VPN、只对您开放的服务器）连接。它只连接您允许的地方，从不读取您的文件，您可随时撤销。"
  "1. Download for your system": "1. 下载适合您系统的版本"
  "macOS: coming soon": "macOS：即将推出"
  "Other systems": "其他系统"
  "Linux (installer)": "Linux（安装程序）"
  "Windows (installer)": "Windows（安装程序）"
  "Android (.apk)": "Android（.apk）"
  "2. Install it": "2. 安装"
  "Linux: make it executable and run it (chmod +x runtime-setup-linux-x86_64 && ./runtime-setup-linux-x86_64).": "Linux：设为可执行并运行（chmod +x runtime-setup-linux-x86_64 && ./runtime-setup-linux-x86_64）。"
  "Windows: double-click runtime-setup.exe.": "Windows：双击 runtime-setup.exe。"
  "Android: open the downloaded file jumphp-runtime-android.apk and allow installing from this browser when your phone asks (it is not on Google Play).": "Android：打开下载的 jumphp-runtime-android.apk，手机询问时允许从此浏览器安装（它不在 Google Play 上）。"
  "3. Start it": "3. 启动"
  "Open \"JumPHP runtime\" once and allow its notifications: it keeps running in the background (a notification shows it) and starts with your phone afterwards. On some phones (Xiaomi...) also allow \"autostart\" and \"no battery restriction\" with its buttons.": "打开一次“JumPHP runtime”并允许其通知：它会在后台保持运行（有通知显示），之后随手机启动。在某些手机（小米等）上，还要用它的按钮允许“自启动”和“无电池限制”。"
  "Open \"JumPHP runtime\" from your applications. An icon appears in the notification area; it starts with your session afterwards.": "从应用列表打开“JumPHP runtime”。通知区域会出现图标；之后它随您的会话启动。"
  "4. Allow this application": "4. 允许此应用"
  "A notification asks whether {title} may use your phone's network: tap Always (or This time). Your browser may also ask to reach devices on your local network: accept.": "通知会询问 {title} 是否可以使用手机的网络：点按“始终”（或“仅此一次”）。浏览器也可能请求访问本地网络中的设备：请允许。"
  "The runtime asks once whether {title} may use your network. Answer Allow. Your browser may also ask to reach devices on your local network: accept.": "Runtime 会询问一次 {title} 是否可以使用您的网络。请回答“允许”。浏览器也可能请求访问本地网络中的设备：请允许。"
  "Start the runtime app": "启动 runtime 应用"
  "Ask for the authorisation now": "立即请求授权"
  "Android help": "Android 帮助"
  "All releases": "所有版本"
  "Close": "关闭"
  "Done": "完成"
  "Local network active. You can close this window.": "本地网络已启用。您可以关闭此窗口。"
  "You refused. Click \"Ask\" to be asked again.": "您已拒绝。点击“询问”可重新被询问。"
  "The runtime is running. Allow this application in its window.": "Runtime 正在运行。请在其窗口中允许此应用。"
  "Waiting for the runtime... (looking again every 2 seconds)": "正在等待 runtime...（每 2 秒重新查找）"
ko:
  "INSTALL": "설치"
  "DOWNLOAD {platform}": "{platform} 다운로드"
  "Server network": "서버 네트워크"
  "Local network active": "로컬 네트워크 사용 중"
  "Allow this app on your network": "이 앱을 내 네트워크에서 허용"
  "Refused - click to ask again": "거부됨 - 클릭하여 다시 묻기"
  "Local network off - install the runtime": "로컬 네트워크 꺼짐 - 런타임을 설치하세요"
  "Looking for the runtime...": "런타임 찾는 중..."
  "Server proxy (your choice)": "서버 프록시(내 선택)"
  "Local": "로컬"
  "Server": "서버"
  "Start / install the app": "앱 시작 / 설치"
  "How to install": "설치 방법"
  "Allow this app": "이 앱 허용"
  "Not now": "나중에"
  "Connections go through the jumphp.net server (the JumPHP runtime does not exist on iPhone).": "연결은 jumphp.net 서버를 거칩니다(JumPHP runtime은 iPhone에는 없습니다)."
  "Android: to connect from your phone's own network (Wi-Fi at home, VPN, a server that only accepts your address), install the free \"JumPHP runtime\" app, open it once, then come back here. Optional: without it {title} connects through the jumphp.net server.": "Android: 휴대폰 자체 네트워크(집 Wi-Fi, VPN, 내 주소만 허용하는 서버)로 연결하려면 무료 앱 „JumPHP runtime”을 설치하고 한 번 연 뒤 여기로 돌아오세요. 선택 사항: 없으면 {title}은(는) jumphp.net 서버를 통해 연결합니다."
  "Recommended: install the free JumPHP runtime so that {title} connects from your own computer (local network, VPN, servers that only accept your address). Optional: without it, the jumphp.net server connects for you.": "권장: 무료 JumPHP runtime을 설치하면 {title}이(가) 내 컴퓨터(로컬 네트워크, VPN, 내 주소만 허용하는 서버)에서 연결합니다. 선택 사항: 없으면 jumphp.net 서버가 대신 연결합니다."
  "You refused {title} on this network. Tap \"Allow this app\" to be asked again.": "이 네트워크에서 {title}을(를) 거부했습니다. 다시 물으려면 „이 앱 허용”을 누르세요."
  "The JumPHP runtime is running: allow {title} to use your network (a question appears: choose Always).": "JumPHP runtime이 실행 중입니다: {title}이(가) 내 네트워크를 사용하도록 허용하세요(질문이 나타나면 „항상”을 선택)."
  "Use your own network": "내 네트워크 사용"
  "{title} can connect from your own phone and network (your IP, your VPN, a server that only opens to you) through the JumPHP runtime, a small app of your phone. It only connects where you allow, never reads your files, and you can revoke it any time.": "{title}은(는) JumPHP runtime(휴대폰의 작은 앱)을 통해 내 휴대폰과 네트워크(내 IP, VPN, 나에게만 열린 서버)에서 연결할 수 있습니다. 허용한 곳에만 연결하고, 파일을 읽지 않으며, 언제든 취소할 수 있습니다."
  "{title} can connect from your own computer and network (your IP, your VPN, a server that only opens to you) through the JumPHP runtime, a small program that stays in your tray. It only connects where you allow, never reads your files, and you can revoke it any time.": "{title}은(는) JumPHP runtime(알림 영역에 머무는 작은 프로그램)을 통해 내 컴퓨터와 네트워크(내 IP, VPN, 나에게만 열린 서버)에서 연결할 수 있습니다. 허용한 곳에만 연결하고, 파일을 읽지 않으며, 언제든 취소할 수 있습니다."
  "1. Download for your system": "1. 내 시스템용 다운로드"
  "macOS: coming soon": "macOS: 곧 지원"
  "Other systems": "다른 시스템"
  "Linux (installer)": "Linux(설치 프로그램)"
  "Windows (installer)": "Windows(설치 프로그램)"
  "Android (.apk)": "Android(.apk)"
  "2. Install it": "2. 설치"
  "Linux: make it executable and run it (chmod +x runtime-setup-linux-x86_64 && ./runtime-setup-linux-x86_64).": "Linux: 실행 가능하게 만들고 실행하세요(chmod +x runtime-setup-linux-x86_64 && ./runtime-setup-linux-x86_64)."
  "Windows: double-click runtime-setup.exe.": "Windows: runtime-setup.exe를 더블클릭하세요."
  "Android: open the downloaded file jumphp-runtime-android.apk and allow installing from this browser when your phone asks (it is not on Google Play).": "Android: 다운로드한 jumphp-runtime-android.apk를 열고, 휴대폰이 물으면 이 브라우저에서의 설치를 허용하세요(Google Play에는 없습니다)."
  "3. Start it": "3. 시작"
  "Open \"JumPHP runtime\" once and allow its notifications: it keeps running in the background (a notification shows it) and starts with your phone afterwards. On some phones (Xiaomi...) also allow \"autostart\" and \"no battery restriction\" with its buttons.": "„JumPHP runtime”을 한 번 열고 알림을 허용하세요: 백그라운드에서 계속 실행되며(알림으로 표시) 이후 휴대폰과 함께 시작됩니다. 일부 휴대폰(Xiaomi 등)에서는 버튼으로 „자동 시작”과 „배터리 제한 없음”도 허용하세요."
  "Open \"JumPHP runtime\" from your applications. An icon appears in the notification area; it starts with your session afterwards.": "앱 목록에서 „JumPHP runtime”을 여세요. 알림 영역에 아이콘이 나타나며, 이후 세션과 함께 시작됩니다."
  "4. Allow this application": "4. 이 애플리케이션 허용"
  "A notification asks whether {title} may use your phone's network: tap Always (or This time). Your browser may also ask to reach devices on your local network: accept.": "알림이 {title}이(가) 휴대폰의 네트워크를 사용해도 되는지 묻습니다: „항상”(또는 „이번만”)을 누르세요. 브라우저가 로컬 네트워크 기기 접근을 요청할 수도 있습니다: 허용하세요."
  "The runtime asks once whether {title} may use your network. Answer Allow. Your browser may also ask to reach devices on your local network: accept.": "런타임이 {title}이(가) 내 네트워크를 사용해도 되는지 한 번 묻습니다. „허용”으로 답하세요. 브라우저가 로컬 네트워크 기기 접근을 요청할 수도 있습니다: 허용하세요."
  "Start the runtime app": "런타임 앱 시작"
  "Ask for the authorisation now": "지금 허가 요청"
  "Android help": "Android 도움말"
  "All releases": "모든 버전"
  "Close": "닫기"
  "Done": "완료"
  "Local network active. You can close this window.": "로컬 네트워크 사용 중. 이 창을 닫아도 됩니다."
  "You refused. Click \"Ask\" to be asked again.": "거부했습니다. 다시 물으려면 „묻기”를 클릭하세요."
  "The runtime is running. Allow this application in its window.": "런타임이 실행 중입니다. 해당 창에서 이 애플리케이션을 허용하세요."
  "Waiting for the runtime... (looking again every 2 seconds)": "런타임을 기다리는 중...(2초마다 다시 찾음)"
