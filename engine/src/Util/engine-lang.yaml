  "{title} can connect from your own computer and network (your IP, your VPN, a server that only opens to you) through the JumPHP runtime, a small program that stays in your tray. It only connects where you allow, never reads your files, and you can revoke it any time.": "{title}, JumPHP runtime sayesinde kendi bilgisayarınızdan ve ağınızdan (IP'niz, VPN'iniz, yalnızca size açılan bir sunucu) bağlanabilir; JumPHP runtime bildirim alanında duran küçük bir programdır. Yalnızca izin verdiğiniz yere bağlanır, dosyalarınızı asla okumaz ve izni istediğiniz an geri alabilirsiniz."
