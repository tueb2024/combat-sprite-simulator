  "Android: open the downloaded file jumphp-runtime-android.apk and allow installing from this browser when your phone asks (it is not on Google Play).": "Android: відкрийте завантажений файл jumphp-runtime-android.apk і дозвольте встановлення з цього браузера, коли запитає телефон (його немає в Google Play)."
  "3. Start it": "3. Запустіть"
  "Open \"JumPHP runtime\" once and allow its notifications: it keeps running in the background (a notification shows it) and starts with your phone afterwards. On some phones (Xiaomi...) also allow \"autostart\" and \"no battery restriction\" with its buttons.": "Відкрийте «JumPHP runtime» один раз і дозвольте сповіщення: він працює у фоні (це видно зі сповіщення) і далі запускається разом із телефоном. На деяких телефонах (Xiaomi...) також дозвольте «автозапуск» і «без обмежень батареї» його кнопками."
  "Open \"JumPHP runtime\" from your applications. An icon appears in the notification area; it starts with your session afterwards.": "Відкрийте «JumPHP runtime» зі списку застосунків. В області сповіщень з'явиться значок; далі він запускається разом із сеансом."
