  "Start / install the app": "Démarrer / installer l'appli"
  "How to install": "Comment l'installer"
  "Allow this app": "Autoriser cette appli"
  "Not now": "Pas maintenant"
  "Connections go through the jumphp.net server (the JumPHP runtime does not exist on iPhone).": "Les connexions passent par le serveur jumphp.net (le JumPHP runtime n'existe pas sur iPhone)."
  "Android: to connect from your phone's own network (Wi-Fi at home, VPN, a server that only accepts your address), install the free \"JumPHP runtime\" app, open it once, then come back here. Optional: without it {title} connects through the jumphp.net server.": "Android : pour vous connecter depuis le réseau de votre téléphone (Wi-Fi de la maison, VPN, serveur qui n'accepte que votre adresse), installez l'appli gratuite « JumPHP runtime », ouvrez-la une fois, puis revenez ici. Facultatif : sans elle, {title} se connecte par le serveur jumphp.net."
  "Recommended: install the free JumPHP runtime so that {title} connects from your own computer (local network, VPN, servers that only accept your address). Optional: without it, the jumphp.net server connects for you.": "Recommandé : installez le JumPHP runtime gratuit pour que {title} se connecte depuis votre propre ordinateur (réseau local, VPN, serveurs qui n'acceptent que votre adresse). Facultatif : sans lui, le serveur jumphp.net se connecte pour vous."
  "You refused {title} on this network. Tap \"Allow this app\" to be asked again.": "Vous avez refusé {title} sur ce réseau. Touchez « Autoriser cette appli » pour qu'on vous le redemande."
  "The JumPHP runtime is running: allow {title} to use your network (a question appears: choose Always).": "Le JumPHP runtime tourne : autorisez {title} à utiliser votre réseau (une question apparaît : choisissez Toujours)."
  "Use your own network": "Utiliser votre propre réseau"
  "{title} can connect from your own phone and network (your IP, your VPN, a server that only opens to you) through the JumPHP runtime, a small app of your phone. It only connects where you allow, never reads your files, and you can revoke it any time.": "{title} peut se connecter depuis votre propre téléphone et réseau (votre IP, votre VPN, un serveur qui ne s'ouvre qu'à vous) grâce au JumPHP runtime, une petite appli de votre téléphone. Il ne se connecte que là où vous l'autorisez, ne lit jamais vos fichiers, et vous pouvez le révoquer à tout moment."
  "{title} can connect from your own computer and network (your IP, your VPN, a server that only opens to you) through the JumPHP runtime, a small program that stays in your tray. It only connects where you allow, never reads your files, and you can revoke it any time.": "{title} peut se connecter depuis votre propre ordinateur et réseau (votre IP, votre VPN, un serveur qui ne s'ouvre qu'à vous) grâce au JumPHP runtime, un petit programme qui reste dans votre zone de notification. Il ne se connecte que là où vous l'autorisez, ne lit jamais vos fichiers, et vous pouvez le révoquer à tout moment."
  "1. Download for your system": "1. Télécharger pour votre système"
  "macOS: coming soon": "macOS : bientôt"
  "Other systems": "Autres systèmes"
  "Linux (installer)": "Linux (installateur)"
  "Windows (installer)": "Windows (installateur)"
  "Android (.apk)": "Android (.apk)"
  "2. Install it": "2. L'installer"
  "Linux: make it executable and run it (chmod +x runtime-setup-linux-x86_64 && ./runtime-setup-linux-x86_64).": "Linux : rendez-le exécutable et lancez-le (chmod +x runtime-setup-linux-x86_64 && ./runtime-setup-linux-x86_64)."
  "Windows: double-click runtime-setup.exe.": "Windows : double-cliquez sur runtime-setup.exe."
  "Android: open the downloaded file jumphp-runtime-android.apk and allow installing from this browser when your phone asks (it is not on Google Play).": "Android : ouvrez le fichier téléchargé jumphp-runtime-android.apk et autorisez l'installation depuis ce navigateur quand le téléphone le demande (il n'est pas sur Google Play)."
  "3. Start it": "3. Le démarrer"
  "Open \"JumPHP runtime\" once and allow its notifications: it keeps running in the background (a notification shows it) and starts with your phone afterwards. On some phones (Xiaomi...) also allow \"autostart\" and \"no battery restriction\" with its buttons.": "Ouvrez « JumPHP runtime » une fois et autorisez ses notifications : il reste actif en arrière-plan (une notification le montre) et démarre ensuite avec votre téléphone. Sur certains téléphones (Xiaomi...) autorisez aussi « démarrage auto » et « aucune restriction de batterie » avec ses boutons."
  "Open \"JumPHP runtime\" from your applications. An icon appears in the notification area; it starts with your session afterwards.": "Ouvrez « JumPHP runtime » depuis vos applications. Une icône apparaît dans la zone de notification ; il démarre ensuite avec votre session."
  "4. Allow this application": "4. Autoriser cette application"
  "A notification asks whether {title} may use your phone's network: tap Always (or This time). Your browser may also ask to reach devices on your local network: accept.": "Une notification demande si {title} peut utiliser le réseau de votre téléphone : touchez Toujours (ou Cette fois). Votre navigateur peut aussi demander l'accès aux appareils de votre réseau local : acceptez."
  "The runtime asks once whether {title} may use your network. Answer Allow. Your browser may also ask to reach devices on your local network: accept.": "Le runtime demande une fois si {title} peut utiliser votre réseau. Répondez Autoriser. Votre navigateur peut aussi demander l'accès aux appareils de votre réseau local : acceptez."
  "Start the runtime app": "Démarrer l'appli runtime"
  "Ask for the authorisation now": "Demander l'autorisation maintenant"
  "Android help": "Aide Android"
  "All releases": "Toutes les versions"
  "Close": "Fermer"
  "Done": "Terminé"
  "Local network active. You can close this window.": "Réseau local actif. Vous pouvez fermer cette fenêtre."
  "You refused. Click \"Ask\" to be asked again.": "Vous avez refusé. Cliquez sur « Demander » pour qu'on vous le redemande."
  "The runtime is running. Allow this application in its window.": "Le runtime tourne. Autorisez cette application dans sa fenêtre."
  "Waiting for the runtime... (looking again every 2 seconds)": "En attente du runtime... (nouvelle recherche toutes les 2 secondes)"
