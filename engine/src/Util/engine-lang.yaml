  "Android: to connect from your phone's own network (Wi-Fi at home, VPN, a server that only accepts your address), install the free \"JumPHP runtime\" app, open it once, then come back here. Optional: without it {title} connects through the jumphp.net server.": "Android: щоб підключатися з мережі вашого телефона (домашній Wi-Fi, VPN, сервер, що приймає лише вашу адресу), встановіть безкоштовний застосунок «JumPHP runtime», відкрийте його один раз і поверніться сюди. За бажанням: без нього {title} підключається через сервер jumphp.net."
  "Recommended: install the free JumPHP runtime so that {title} connects from your own computer (local network, VPN, servers that only accept your address). Optional: without it, the jumphp.net server connects for you.": "Рекомендовано: встановіть безкоштовний JumPHP runtime, щоб {title} підключався з вашого комп'ютера (локальна мережа, VPN, сервери, що приймають лише вашу адресу). За бажанням: без нього підключається сервер jumphp.net."
