  "{title} can connect from your own computer and network (your IP, your VPN, a server that only opens to you) through the JumPHP runtime, a small program that stays in your tray. It only connects where you allow, never reads your files, and you can revoke it any time.": "{title} は JumPHP runtime（通知領域に常駐する小さなプログラム）を通じて、あなた自身のコンピューターとネットワーク（あなたの IP、VPN、あなただけに開かれたサーバー）から接続できます。許可した接続先にしか接続せず、ファイルを読み取ることはなく、いつでも取り消せます。"
