  "The JumPHP runtime is running: allow {title} to use your network (a question appears: choose Always).": "JumPHP runtime працює: дозвольте {title} використовувати вашу мережу (з'явиться запитання: виберіть Завжди)."
  "Use your own network": "Використати вашу мережу"
  "{title} can connect from your own phone and network (your IP, your VPN, a server that only opens to you) through the JumPHP runtime, a small app of your phone. It only connects where you allow, never reads your files, and you can revoke it any time.": "{title} може підключатися з вашого телефона й мережі (ваш IP, ваш VPN, сервер, відкритий лише для вас) через JumPHP runtime — невеликий застосунок телефона. Він підключається лише туди, куди ви дозволили, ніколи не читає ваші файли, і дозвіл можна відкликати будь-коли."
  "{title} can connect from your own computer and network (your IP, your VPN, a server that only opens to you) through the JumPHP runtime, a small program that stays in your tray. It only connects where you allow, never reads your files, and you can revoke it any time.": "{title} може підключатися з вашого комп'ютера й мережі (ваш IP, ваш VPN, сервер, відкритий лише для вас) через JumPHP runtime — невелику програму в області сповіщень. Вона підключається лише туди, куди ви дозволили, ніколи не читає ваші файли, і дозвіл можна відкликати будь-коли."
