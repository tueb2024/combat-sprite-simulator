  "{title} can connect from your own phone and network (your IP, your VPN, a server that only opens to you) through the JumPHP runtime, a small app of your phone. It only connects where you allow, never reads your files, and you can revoke it any time.": "{title} может подключаться с вашего телефона и из вашей сети (ваш IP, ваш VPN, сервер, открытый только для вас) через JumPHP runtime — небольшое приложение телефона. Оно подключается только туда, куда вы разрешили, никогда не читает ваши файлы, и вы можете отозвать разрешение в любой момент."
  "{title} can connect from your own computer and network (your IP, your VPN, a server that only opens to you) through the JumPHP runtime, a small program that stays in your tray. It only connects where you allow, never reads your files, and you can revoke it any time.": "{title} может подключаться с вашего компьютера и из вашей сети (ваш IP, ваш VPN, сервер, открытый только для вас) через JumPHP runtime — небольшую программу в области уведомлений. Она подключается только туда, куда вы разрешили, никогда не читает ваши файлы, и вы можете отозвать разрешение в любой момент."
  "1. Download for your system": "1. Скачайте для вашей системы"
  "macOS: coming soon": "macOS: скоро"
  "Other systems": "Другие системы"
  "Linux (installer)": "Linux (установщик)"
  "Windows (installer)": "Windows (установщик)"
  "Android (.apk)": "Android (.apk)"
  "2. Install it": "2. Установите"
  "Linux: make it executable and run it (chmod +x runtime-setup-linux-x86_64 && ./runtime-setup-linux-x86_64).": "Linux: сделайте файл исполняемым и запустите (chmod +x runtime-setup-linux-x86_64 && ./runtime-setup-linux-x86_64)."
  "Windows: double-click runtime-setup.exe.": "Windows: дважды щёлкните runtime-setup.exe."
  "Android: open the downloaded file jumphp-runtime-android.apk and allow installing from this browser when your phone asks (it is not on Google Play).": "Android: откройте скачанный файл jumphp-runtime-android.apk и разрешите установку из этого браузера, когда спросит телефон (его нет в Google Play)."
  "3. Start it": "3. Запустите"
  "Open \"JumPHP runtime\" once and allow its notifications: it keeps running in the background (a notification shows it) and starts with your phone afterwards. On some phones (Xiaomi...) also allow \"autostart\" and \"no battery restriction\" with its buttons.": "Откройте «JumPHP runtime» один раз и разрешите уведомления: он работает в фоне (это видно по уведомлению) и затем запускается вместе с телефоном. На некоторых телефонах (Xiaomi...) также разрешите «автозапуск» и «без ограничений батареи» его кнопками."
  "Open \"JumPHP runtime\" from your applications. An icon appears in the notification area; it starts with your session afterwards.": "Откройте «JumPHP runtime» из списка приложений. В области уведомлений появится значок; затем он запускается вместе с сеансом."
  "4. Allow this application": "4. Разрешите это приложение"
  "A notification asks whether {title} may use your phone's network: tap Always (or This time). Your browser may also ask to reach devices on your local network: accept.": "Уведомление спрашивает, может ли {title} использовать сеть вашего телефона: нажмите Всегда (или Только сейчас). Браузер может также запросить доступ к устройствам локальной сети: разрешите."
  "The runtime asks once whether {title} may use your network. Answer Allow. Your browser may also ask to reach devices on your local network: accept.": "Runtime один раз спросит, может ли {title} использовать вашу сеть. Ответьте Разрешить. Браузер может также запросить доступ к устройствам локальной сети: разрешите."
  "Start the runtime app": "Запустить приложение runtime"
  "Ask for the authorisation now": "Запросить разрешение сейчас"
  "Android help": "Справка Android"
  "All releases": "Все версии"
  "Close": "Закрыть"
  "Done": "Готово"
  "Local network active. You can close this window.": "Локальная сеть активна. Можно закрыть это окно."
  "You refused. Click \"Ask\" to be asked again.": "Вы отказали. Нажмите «Спросить», чтобы вас спросили снова."
  "The runtime is running. Allow this application in its window.": "Runtime работает. Разрешите это приложение в его окне."
  "Waiting for the runtime... (looking again every 2 seconds)": "Ожидание runtime... (повторный поиск каждые 2 секунды)"
