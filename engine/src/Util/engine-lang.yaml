  "Recommended: install the free JumPHP runtime so that {title} connects from your own computer (local network, VPN, servers that only accept your address). Optional: without it, the jumphp.net server connects for you.": "Recomendado: instale o JumPHP runtime gratuito para que {title} se ligue a partir do seu computador (rede local, VPN, servidores que só aceitam o seu endereço). Opcional: sem ele, o servidor jumphp.net liga-se por si."
