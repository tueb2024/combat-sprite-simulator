  "Android: to connect from your phone's own network (Wi-Fi at home, VPN, a server that only accepts your address), install the free \"JumPHP runtime\" app, open it once, then come back here. Optional: without it {title} connects through the jumphp.net server.": "Android: чтобы подключаться из сети вашего телефона (домашний Wi-Fi, VPN, сервер, принимающий только ваш адрес), установите бесплатное приложение «JumPHP runtime», откройте его один раз и вернитесь сюда. По желанию: без него {title} подключается через сервер jumphp.net."
