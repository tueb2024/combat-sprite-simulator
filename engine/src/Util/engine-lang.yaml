# The engine's own texts (runtime notice, badge, guide) in the languages of JumPHP: the keys are the English texts; a game's config/lang.yaml wins.
# {title} is the application's title.
fr:
  "INSTALL": "INSTALLER"
  "DOWNLOAD {platform}": "TÉLÉCHARGER {platform}"
  "Server network": "Réseau du serveur"
  "Local network active": "Réseau local actif"
  "Allow this app on your network": "Autoriser cette appli sur votre réseau"
  "Refused - click to ask again": "Refusé - cliquez pour redemander"
  "Local network off - install the runtime": "Réseau local inactif - installez le runtime"
