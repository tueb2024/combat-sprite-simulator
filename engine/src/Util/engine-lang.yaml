  "Open \"JumPHP runtime\" once and allow its notifications: it keeps running in the background (a notification shows it) and starts with your phone afterwards. On some phones (Xiaomi...) also allow \"autostart\" and \"no battery restriction\" with its buttons.": "Abra o «JumPHP runtime» uma vez e permita as suas notificações: fica ativo em segundo plano (uma notificação mostra-o) e arranca depois com o telemóvel. Em alguns telemóveis (Xiaomi...) permita também «arranque automático» e «sem restrição de bateria» com os seus botões."
