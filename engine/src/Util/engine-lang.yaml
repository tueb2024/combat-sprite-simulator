  "{title} can connect from your own phone and network (your IP, your VPN, a server that only opens to you) through the JumPHP runtime, a small app of your phone. It only connects where you allow, never reads your files, and you can revoke it any time.": "{title} pode ligar-se a partir do seu telemóvel e da sua rede (o seu IP, a sua VPN, um servidor que só se abre para si) através do JumPHP runtime, uma pequena app do telemóvel. Só se liga onde permitir, nunca lê os seus ficheiros e pode revogá-lo a qualquer momento."
  "{title} can connect from your own computer and network (your IP, your VPN, a server that only opens to you) through the JumPHP runtime, a small program that stays in your tray. It only connects where you allow, never reads your files, and you can revoke it any time.": "{title} pode ligar-se a partir do seu computador e da sua rede (o seu IP, a sua VPN, um servidor que só se abre para si) através do JumPHP runtime, um pequeno programa que fica na área de notificação. Só se liga onde permitir, nunca lê os seus ficheiros e pode revogá-lo a qualquer momento."
